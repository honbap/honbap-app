<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#147A5D;color:#fff;transition:opacity .45s ease,visibility .45s;}
#splash.off{opacity:0;visibility:hidden;pointer-events:none;}
#splash svg{width:104px;height:104px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:spl 1.1s ease-out both;}
#splash b{font:400 34px 'Jua','Noto Sans KR',system-ui,sans-serif;letter-spacing:1px;animation:spt .9s .15s ease-out both;}
#splash small{font:500 14px 'Noto Sans KR',system-ui,sans-serif;opacity:.85;animation:spt .9s .3s ease-out both;}
@keyframes spl{from{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}to{transform:scale(1);opacity:1}}
@keyframes spt{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
</head>
<body>
<div id="splash" role="presentation"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#fff"/><path d="M96 232h320a160 160 0 0 1-320 0z" fill="#147A5D"/><path d="M176 196c0-28 20-40 20-64M256 196c0-28 20-40 20-64M336 196c0-28 20-40 20-64" fill="none" stroke="#147A5D" stroke-width="22" stroke-linecap="round"/></svg><b>밥친구</b><small>같은 학교 혼밥러 모임</small></div>
<script>window.__t0=Date.now();window.hideSplash=function(){var e=document.getElementById("splash");if(!e||e.dataset.h)return;e.dataset.h=1;setTimeout(function(){e.classList.add("off");setTimeout(function(){e.remove()},600)},Math.max(0,1000-(Date.now()-window.__t0)));};setTimeout(window.hideSplash,7000);</script>
<div id="app">
  <div id="screen"></div>
  <div id="sheet"></div>
  <div id="notice" class="notice" hidden><span>로그인 유지를 위해 이 기기에 꼭 필요한 저장소만 사용해요. <a href="legal.html#cookies" target="_blank" rel="noopener">자세히</a></span><button data-act="cookieok">확인</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
