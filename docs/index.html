<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FCFBF5;color:#4B6B57;overflow:hidden;transition:opacity .5s ease,visibility .5s;}
#splash.off{opacity:0;visibility:hidden;pointer-events:none;}
#splash .bg{position:absolute;inset:0;width:100%;height:100%;}
#splash .ct{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-4vh;}
#splash .bowl{width:132px;height:132px;animation:spl 1s ease-out both;}
#splash b{font:700 42px 'Jua','Noto Sans KR',system-ui,sans-serif;letter-spacing:2px;color:#4B6B57;-webkit-text-stroke:1.6px #4B6B57;paint-order:stroke fill;stroke-linejoin:round;stroke-linecap:round;margin-top:6px;animation:spt .9s .15s ease-out both;}
#splash small{font:400 15px 'Noto Sans KR',system-ui,sans-serif;color:#7C9482;letter-spacing:.3px;animation:spt .9s .3s ease-out both;}
@keyframes spl{from{transform:translateY(10px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes spt{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes steam{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#splash .st path{animation:steam 2.2s ease-in-out infinite}#splash .st path:nth-child(2){animation-delay:.35s}#splash .st path:nth-child(3){animation-delay:.7s}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
