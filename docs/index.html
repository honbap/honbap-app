<style>
#splash{position:fixed;inset:5px 0;z-index:9999;background:#FAF8EE;transition:opacity .35s ease,visibility .35s;}
html.sp,html.sp body{background:#FAF8EE!important}
#splash.off{opacity:0;visibility:hidden;pointer-events:none;}
#splash .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
#splash .lg{position:absolute;left:50%;top:49%;width:min(44vw,190px);height:auto;transform:translate(-50%,-50%);mix-blend-mode:multiply;animation:spl 1s .1s cubic-bezier(.2,.7,.2,1) both;}
@keyframes spl{from{opacity:0;transform:translate(-50%,-47%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){#splash .lg{animation:none}}
</style>

<body>
<div id="splash" role="presentation"><img class="bgi" src="splash.jpg?v=2" alt=""><img class="lg" src="splash-logo.png?v=3" alt=""></div>
<script>window.__t0=Date.now();window.hideSplash=function(){var e=document.getElementById("splash");if(!e||e.dataset.h)return;e.dataset.h=1;setTimeout(function(){document.documentElement.classList.remove("sp");e.classList.add("off");setTimeout(function(){e.remove()},450)},Math.max(0,1200-(Date.now()-window.__t0)));};setTimeout(window.hideSplash,7000);</script>
